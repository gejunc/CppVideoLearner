name: Build macOS

# 在 GitHub 的 macOS 机器上构建 .dmg / .zip
# 用法：Actions 页面 → Build macOS → Run workflow
# 产物在 workflow 运行页底部的 Artifacts 里下载

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '要构建的架构'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - arm64
          - x64
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    name: macOS build
    runs-on: macos-latest
    timeout-minutes: 60

    # 需要写权限才能把产物发布到 Releases
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # 不启用任何缓存：setup-node@v4 默认会自动检测包管理器并执行
      # `pnpm store path`，这一句是这条流水线最脆弱的地方。缓存只是加速，去掉更稳。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      - name: 打印环境信息（排错用）
        run: |
          echo "node: $(node -v)"
          echo "pnpm: $(pnpm -v)"
          echo "arch: $(uname -m)"
          echo "cwd : $(pwd)"
          ls -la

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      # pnpm 默认会拦掉 electron 的 postinstall，需要手动下载二进制
      - name: 下载 Electron（当前平台）
        run: node node_modules/electron/install.js

      # --publish never：不指定的话 electron-builder 在 CI 里会以为要发布到
      # GitHub Releases，然后因为缺 GH_TOKEN 直接失败。产物由下面 upload-artifact 收集。
      - name: 构建（Apple Silicon + Intel）
        if: ${{ github.event.inputs.arch == 'both' || github.event.inputs.arch == '' }}
        run: pnpm exec electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 构建（仅 Apple Silicon）
        if: ${{ github.event.inputs.arch == 'arm64' }}
        run: pnpm exec electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 构建（仅 Intel）
        if: ${{ github.event.inputs.arch == 'x64' }}
        run: pnpm exec electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 列出产物
        run: ls -lh release/

      # 直接发布到 Releases，这样网站可以直接链接固定地址，
      # 不必先把 200 多 MB 的 artifact 拉到本地再上传。
      # tag 固定为 `mac-latest`，重复运行会覆盖同名附件，地址永远不变。
      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-latest
          name: macOS 最新构建
          body: |
            由 GitHub Actions 自动构建，代码提交 ${{ github.sha }}。

            - Apple Silicon（M1/M2/M3/M4）：`CppVideoLearner-*-arm64.zip`
            - Intel Mac：`CppVideoLearner-*-x64.zip`

            下载后解压，把 App 拖进「应用程序」即可。
            首次打开若被拦截：右键 App → 打开，或终端执行 `xattr -cr /Applications/CppVideoLearner.app`。
          files: |
            release/*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: CppVideoLearner-macOS
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 30
